# ===========================
# WARZONE
# ===========================
warzone:
  enabled: true
  spawnSafe:
    enabled: false
  combatTag:
    enabled: true
    durationSeconds: 15
    # Blockierte Befehle während des Combat-Tags. "f home" blockiert nur das
    # Subcommand "home" von /f, nicht /f komplett. Aliase (z.B. /lobbyserver
    # für /hub) werden automatisch mit erkannt.
    blockedCommands:
      - "spawn"
      - "hub"
      - "f home"
    # Wer während eines aktiven Combat-Tags den Server verlässt, verliert seine
    # komplette Ausrüstung (anders als ein normaler Tod, bei dem sie erhalten bleibt).
    dropItemsOnLogout: true
    # Wer in der Warzone stirbt, verliert seine Ausrüstung nur, wenn er zum
    # Todeszeitpunkt noch im Combat-Tag steht. Ein Tod ohne aktives PvP
    # (Sturz, Mob, o.ä.) bleibt ohne Verlust.
    dropItemsOnDeath: true
  disparity:
    blocksPerLevel: 50
    maxLevel: 100
    # Gemeinsame Eskalationsstufen fuer Mob-Varianten (WarzoneMobService) UND
    # Bossbar-Optik (WarzoneBossBarManager) -- ab hier schalten neue Mob-Typen frei
    # und die Bossbar-Farbe/das Label eskaliert weiter statt bei Stufe 3 einzufrieren.
    tierLow: 16
    tierMedium: 41
    tierHigh: 71
    # Leichte Partikel-Aura um Spieler ab Tier "high", die mit der Stufe intensiver wird.
    auraParticles: true
  mobs:
    max-active: 8
    spawn-every-seconds: 28
    boss-every-seconds: 300
    killCoinsBase: 3
    killCoinsPerDisparity: 2
    speed: 0.11
    boss-speed: 0.0
    # Speed waechst leicht mit der Disparity-Stufe (vorher komplett flach).
    speedPerLevel: 0.0015
    speedCap: 0.32
    # Schadens-Multiplikator pro Stufe -- wirkt auf den tatsaechlichen Schadenswert
    # (Nahkampf, Pfeile, Zauber gleichermassen), nicht nur auf ein Attribut, damit
    # Fernkampf-/Caster-Mobs (Skeleton, Stray, Pillager, Evoker) mitskalieren.
    damagePerLevel: 0.06
    damageMultiplierCap: 3.0
  bossbar:
    enabled: true
    title: "&6&lWarzone &8» &7Disparity: {disparity}"
    color: YELLOW
    style: SEGMENTED_10
  chests:
    legacy-manager-enabled: false
    spawn:
      maxActive: 4
      everySeconds: 120
      despawnAfterOpenSeconds: 0
      minRollsPerChest: 2
      rollsPerChest: 6

