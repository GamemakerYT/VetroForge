# ===========================
# ANTICHEAT (Phase 1: Speed/Fly/Reach, nur Logging/Staff-Alert, kein Auto-Punish)
# ===========================
anticheat:
  enabled: true
  alertStaff: true
  # Cooldown pro Spieler zwischen zwei Staff-Alerts (egal welcher Check ausgeloest hat).
  alertCooldownMillis: 15000
  # Kulanzfenster nach Schaden/Teleport/Respawn/Fahrzeug-Ausstieg, in dem nichts geprueft wird
  # (Knockback, Teleport-Sprung etc. sehen sonst wie Speed-/Fly-Hacks aus).
  graceMillisAfterDamage: 600
  graceMillisAfterTeleport: 1000
  speed:
    # Vielfaches der erwarteten Maximalgeschwindigkeit, bevor ueberhaupt ein Verstoss zaehlt.
    toleranceMultiplier: 1.5
    # So viele Verstoesse muessen innerhalb windowMillis passieren, bevor Staff alarmiert wird.
    violationsToFlag: 4
    windowMillis: 4000
  reach:
    maxDistance: 4.2
    violationsToFlag: 3
    windowMillis: 5000

